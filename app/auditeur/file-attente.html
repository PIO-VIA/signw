<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File d’Attente d’Audit — signw</title>
  <link rel="icon" type="image/png" href="../../favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/pages.css">
</head>
<body class="app-layout">

  <aside class="app-sidebar" id="app-sidebar"></aside>

  <div class="app-container">
    <header class="app-header" id="app-header"></header>

    <main class="app-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div>
          <h2 style="margin: 0 0 4px;">File d’Attente des Dossiers à Vérifier</h2>
          <span class="text-muted text-sm">Gestion des dossiers par priorité et respect des délais SLA</span>
        </div>
      </div>

      <!-- Filtres -->
      <div class="card" style="padding: 16px 20px; margin-bottom: 24px;">
        <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
          <input type="text" id="queue-search" class="form-control" style="max-width: 280px;" placeholder="Rechercher entreprise..." oninput="filterQueue()">
          <select id="queue-filter-status" class="form-control" style="max-width: 200px;" onchange="filterQueue()">
            <option value="all">Tous les statuts</option>
            <option value="en_verification" selected>En vérification</option>
            <option value="pieces_incompletes">Pièces incomplètes</option>
            <option value="soumis">Soumis (en attente)</option>
          </select>
        </div>
      </div>

      <div class="card" style="padding: 0; overflow: hidden;">
        <div class="table-container" style="border: none;">
          <table class="table">
            <thead>
              <tr>
                <th>Réf & Entreprise</th>
                <th>Secteur</th>
                <th>Date soumission</th>
                <th>Statut</th>
                <th>Score provisoire</th>
                <th>Pièces</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="queue-table-body">
              <!-- Rendu dynamique JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../../js/data/seed.js"></script>
  <script src="../../js/core/utils.js"></script>
  <script src="../../js/core/store.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/score.js"></script>
  <script src="../../js/core/ui.js"></script>
  <script src="../../js/core/layout.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!window.SignwAuth.requireAuth(['auditeur', 'admin'])) return;
      filterQueue();
    });

    function filterQueue() {
      const q = (document.getElementById('queue-search').value || '').toLowerCase();
      const status = document.getElementById('queue-filter-status').value;

      let dossiers = window.SignwStore.getDossiers();

      if (status !== 'all') {
        dossiers = dossiers.filter(d => d.statut === status);
      } else {
        dossiers = dossiers.filter(d => ['soumis', 'en_verification', 'pieces_incompletes'].includes(d.statut));
      }

      if (q) {
        dossiers = dossiers.filter(d => {
          const agt = window.SignwStore.getAgentById(d.agentId);
          return (agt && agt.raisonSociale.toLowerCase().includes(q)) || d.id.toLowerCase().includes(q);
        });
      }

      renderQueue(dossiers);
    }

    function renderQueue(list) {
      const tbody = document.getElementById('queue-table-body');
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted" style="padding: 32px;">Aucun dossier dans la file d’attente.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(d => {
        const agt = window.SignwStore.getAgentById(d.agentId) || { raisonSociale: 'Agent', ville: 'Douala' };
        const sec = window.SignwStore.getSectorById(d.secteurId) || { nom: 'BTP' };
        const pieces = window.SignwStore.getPiecesByDossier(d.id);
        const validated = pieces.filter(p => p.statutPiece === 'validee').length;

        return `
          <tr>
            <td>
              <strong style="color: var(--brand-900); font-size: 0.95rem;">${agt.raisonSociale}</strong>
              <div class="text-xs text-muted">${d.id} • 📍 ${agt.ville}</div>
            </td>
            <td>${sec.nom}</td>
            <td>${d.soumisLe || d.creeLe}</td>
            <td>${window.SignwUtils.getStatusBadge(d.statut)}</td>
            <td><strong>${d.scoreProvisoire || 0}</strong> / 100</td>
            <td>${validated} / ${pieces.length || 6} validée(s)</td>
            <td>
              <a href="audit.html?id=${d.id}" class="btn btn-primary btn-sm">
                Ouvrir poste d’audit →
              </a>
            </td>
          </tr>
        `;
      }).join('');
    }
  </script>
</body>
</html>
