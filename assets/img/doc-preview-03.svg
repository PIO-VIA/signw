<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <filter id="docShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>
  <!-- Paper -->
  <rect x="20" y="20" width="560" height="760" rx="12" fill="#FFFFFF" stroke="#CBD0D8" stroke-width="1" filter="url(#docShadow)" />
  <!-- Letterhead -->
  <rect x="20" y="20" width="560" height="10" rx="4" fill="#7A1B34" />
  <circle cx="70" cy="75" r="26" fill="#F8E6EB" />
  <path d="M60 75 L67 82 L80 68" fill="none" stroke="#7A1B34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="110" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#14161A">RÉPUBLIQUE DU CAMEROUN</text>
  <text x="110" y="88" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#6B7280">Paix - Travail - Patrie • Greffe du Tribunal de Commerce de Douala</text>
  <line x1="50" y1="115" x2="550" y2="115" stroke="#CBD0D8" stroke-width="1.5" />
  
  <!-- Doc Title -->
  <rect x="50" y="140" width="500" height="44" rx="8" fill="#F3F4F7" />
  <text x="300" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#7A1B34" text-anchor="middle">RCCM & IMMATRICULATION</text>
  
  <!-- Content Lines Simulation -->
  <g fill="#9CA3AF">
    <rect x="50" y="215" width="220" height="12" rx="4" />
    <rect x="290" y="215" width="260" height="12" rx="4" fill="#D1D5DB" />
    <rect x="50" y="245" width="180" height="12" rx="4" />
    <rect x="250" y="245" width="300" height="12" rx="4" fill="#D1D5DB" />
    
    <rect x="50" y="285" width="500" height="8" rx="3" opacity="0.5" />
    <rect x="50" y="305" width="480" height="8" rx="3" opacity="0.5" />
    <rect x="50" y="325" width="440" height="8" rx="3" opacity="0.5" />
    <rect x="50" y="345" width="490" height="8" rx="3" opacity="0.5" />
    
    <!-- Table Simulation -->
    <rect x="50" y="385" width="500" height="28" rx="4" fill="#E5E7EB" />
    <rect x="50" y="420" width="500" height="36" rx="4" fill="#F9FAFB" stroke="#E5E7EB" />
    <rect x="50" y="465" width="500" height="36" rx="4" fill="#FFFFFF" stroke="#E5E7EB" />
    <rect x="50" y="510" width="500" height="36" rx="4" fill="#F9FAFB" stroke="#E5E7EB" />
    
    <rect x="70" y="433" width="140" height="10" rx="3" fill="#6B7280" />
    <rect x="430" y="433" width="100" height="10" rx="3" fill="#111827" />
    <rect x="70" y="478" width="170" height="10" rx="3" fill="#6B7280" />
    <rect x="430" y="478" width="100" height="10" rx="3" fill="#111827" />
  </g>
  
  <!-- Stamp / Sceau Officiel -->
  <g transform="translate(380, 580) rotate(-12)">
    <circle cx="75" cy="75" r="68" fill="none" stroke="#7A1B34" stroke-width="4" stroke-dasharray="6 3" opacity="0.85" />
    <circle cx="75" cy="75" r="56" fill="none" stroke="#7A1B34" stroke-width="2" opacity="0.85" />
    <text x="75" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#7A1B34" text-anchor="middle">ENREGISTRÉ</text>
    <text x="75" y="84" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#7A1B34" text-anchor="middle">14 OCT. 2026</text>
    <path d="M50 100 Q75 88 100 102" fill="none" stroke="#7A1B34" stroke-width="2" />
  </g>
  
  <!-- Signature -->
  <path d="M120 700 Q150 660 190 710 T250 680" fill="none" stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round" />
  <text x="120" y="735" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#4B5563">Pour le Délégué Régional / Le Greffier en Chef</text>
  <text x="120" y="750" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#9CA3AF">Signature électronique certifiée conforme</text>
</svg>