<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEEAA1" />
      <stop offset="50%" stop-color="#D99A1E" />
      <stop offset="100%" stop-color="#8A5E08" />
    </linearGradient>
    <linearGradient id="sealBordeaux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A2A47" />
      <stop offset="100%" stop-color="#3B0D1A" />
    </linearGradient>
  </defs>
  <!-- Outer serrated edge / starburst -->
  <circle cx="100" cy="100" r="94" fill="url(#sealGold)" />
  <circle cx="100" cy="100" r="88" fill="#7A1B34" stroke="url(#sealGold)" stroke-width="3" stroke-dasharray="4,3" />
  <circle cx="100" cy="100" r="68" fill="url(#sealBordeaux)" stroke="url(#sealGold)" stroke-width="2" />
  <!-- Text on arc placeholder / styling -->
  <path id="curve" d="M 38,100 A 62,62 0 1,1 162,100" fill="none" stroke="none" />
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FEEAA1" letter-spacing="2">
    <textPath href="#curve" startOffset="50%" text-anchor="middle">TIERS DE CONFIANCE CERTIFIÉ</textPath>
  </text>
  <!-- Center shield & star -->
  <g transform="translate(80, 75) scale(0.4)">
    <path d="M50 8 C68 8, 86 16, 86 32 C86 62, 58 84, 50 92 C42 84, 14 62, 14 32 C14 16, 32 8, 50 8 Z" fill="url(#sealGold)" />
    <path d="M34 48 L46 60 L70 34" fill="none" stroke="#3B0D1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="100" y="145" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">RÉPUBLIQUE DU CAMEROUN</text>
  <text x="100" y="160" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#FEEAA1" text-anchor="middle">SIGNW • MARCHE PUBLIC</text>
</svg>