      <stop offset="0%" stop-color="#9A2A47" />
      <stop offset="100%" stop-color="#7A1B34" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C451" />
      <stop offset="100%" stop-color="#D99A1E" />
    </linearGradient>
  </defs>
  <!-- Emblem -->
  <g transform="translate(5, 5) scale(0.6)">
    <path d="M50 8 C68 8, 86 16, 86 32 C86 62, 58 84, 50 92 C42 84, 14 62, 14 32 C14 16, 32 8, 50 8 Z" fill="url(#logoGrad)" />
    <path d="M34 48 L46 60 L70 34" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="50" cy="24" r="5" fill="url(#goldAccent)" />
  </g>
  <!-- Wordmark -->
  <text x="75" y="46" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="38" fill="#14161A" letter-spacing="-1.5">sign<tspan fill="#7A1B34">w</tspan></text>
  <!-- Trust badge pill -->
  <rect x="190" y="24" width="75" height="20" rx="10" fill="#FBF1D9" stroke="#D99A1E" stroke-width="1" />
  <text x="227" y="38" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#9A6B0A" text-anchor="middle">CERTIF</text>
