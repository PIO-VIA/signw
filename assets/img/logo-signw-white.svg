<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 70" width="300" height="70">
  <defs>
    <linearGradient id="shieldGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D99A1E" />
      <stop offset="100%" stop-color="#9A6B0A" />
    </linearGradient>
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>
  <!-- Emblem -->
  <g transform="translate(5, 5) scale(0.6)">
    <path d="M50 8 C68 8, 86 16, 86 32 C86 62, 58 84, 50 92 C42 84, 14 62, 14 32 C14 16, 32 8, 50 8 Z" fill="url(#shieldGradWhite)" />
    <path d="M34 48 L46 60 L70 34" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="50" cy="24" r="5" fill="#FFFFFF" />
  </g>
  <!-- Wordmark -->
  <text x="75" y="46" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="2">SIGN<tspan fill="url(#goldTextGrad)">W</tspan></text>
  <!-- Trust badge pill on dark background -->
  <rect x="210" y="24" width="75" height="20" rx="10" fill="#D99A1E" stroke="#FDE047" stroke-width="1.5" />
  <text x="247" y="38" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="800" fill="#1E0D12" text-anchor="middle" letter-spacing="0.5">CERTIF</text>
</svg>
